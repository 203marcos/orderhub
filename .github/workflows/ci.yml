name: CI/CD

# Runs on every branch push (tests) and on PRs to main. Images are published to GHCR
# only when main advances (see the publish-images job).
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/orderhub

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) BUILD & TEST
  #    Compiles the whole reactor and runs unit + integration tests. Integration
  #    tests are @Tag("integration") and spin up real PostgreSQL/Kafka/Redis via
  #    Testcontainers — enabled by overriding the default `-DexcludedGroups=integration`
  #    with an empty value. Docker is available on GitHub-hosted runners.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Fast fail on any compilation error before spending time on containers.
      - name: Compile all modules
        run: mvn -B clean package -DskipTests --no-transfer-progress

      # Consumer (order-service) generates the Pact contract into target/pacts.
      - name: Test gateway, auth, catalog, order (unit + integration)
        run: mvn -B verify -pl api-gateway,auth-service,catalog-service,order-service -DexcludedGroups= --no-transfer-progress

      # The provider must verify the contract the consumer just produced.
      - name: Publish Pact contract to the provider
        run: |
          mkdir -p payment-service/pacts
          cp order-service/target/pacts/*.json payment-service/pacts/

      - name: Test payment, notification (unit + integration + Pact provider)
        run: mvn -B verify -pl payment-service,notification-service -DexcludedGroups= --no-transfer-progress

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'

  # ────────────────────────────────────────────────────────────────────────────
  # 2) SECURITY SCAN
  #    Scans the repository (dependencies + IaC) for CRITICAL/HIGH vulnerabilities.
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'          # report only; do not fail the build (tighten to '1' later)
          severity: 'CRITICAL,HIGH'

  # ────────────────────────────────────────────────────────────────────────────
  # 3) BUILD & PUSH IMAGES  ("subir")
  #    On main only: builds each service image from its Dockerfile and pushes it to
  #    GitHub Container Registry, tagged with both `latest` and the commit SHA.
  #    These are the images the Helm chart / k8s deploys reference.
  # ────────────────────────────────────────────────────────────────────────────
  publish-images:
    name: Build & Push Images (GHCR)
    needs: [ test, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
