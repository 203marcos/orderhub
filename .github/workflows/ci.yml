name: CI/CD

# Runs on every branch push (tests) and on PRs to main. Images are published to GHCR
# only when main advances (see the publish-images job).
#
# Dedupe: an internal PR (branch lives in this repo) already triggers the `push` event,
# so without a guard every job would run twice while that PR is open. Each job below
# carries:
#   if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
# which keeps push-driven CI working for the owner's direct branch pushes (no PR involved)
# and still runs CI for pull_request events that originate from a fork (those have no
# matching push event in this repo, since the push happened in the fork). An internal PR
# is skipped on the pull_request event and relies on the push event instead.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run — except on main, where an
# in-flight run is the one publishing images to GHCR. Cancelling that mid-push can leave
# a service without a `latest`/SHA tag pushed at all, so main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/orderhub

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) BUILD & TEST
  #    Compiles the whole reactor and runs unit + integration tests. Integration
  #    tests are @Tag("integration") and spin up real PostgreSQL/Kafka/Redis via
  #    Testcontainers — enabled by overriding the default `-DexcludedGroups=integration`
  #    with an empty value. Docker is available on GitHub-hosted runners.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Fast fail on any compilation error before spending time on containers.
      #
      # `install`, not `package`: the services depend on the common-kafka and common-outbox
      # modules built here. A `package` leaves them in target/ only, so the later per-module
      # commands would look for com.orderhub:common-outbox on Maven Central and fail.
      - name: Build and install all modules
        run: mvn -B clean install -DskipTests --no-transfer-progress

      # Pact is consumer-driven: order-service writes the contract, payment-service verifies
      # it. The provider's test is an ordinary unit test, so it runs in the reactor-wide step
      # below — which means the contract has to exist before that step, not after it.
      #
      # No -am: the shared modules were installed above, and -Dtest= would fail on a module
      # that has no matching test.
      - name: Generate the Pact contract (consumer)
        run: mvn -B test -pl order-service -Dtest=PaymentServiceContractTest --no-transfer-progress

      - name: Publish the Pact contract to the provider
        run: |
          mkdir -p payment-service/target/pacts
          cp order-service/target/pacts/*.json payment-service/target/pacts/

      # Everything except the Docker-backed tests, across the whole reactor. A logic error
      # fails here in about a minute instead of after waiting for containers to start.
      - name: Unit, slice, architecture and contract tests
        run: mvn -B test --no-transfer-progress

      # From here each module is verified on its own, with the @Tag("integration")
      # Testcontainers tests enabled and the JaCoCo gate applied.
      #
      # One step per module so a red build names the service straight away, and
      # `!cancelled()` so they all run: an unrelated failure in order-service should not hide
      # the state of payment-service. A failed step still fails the job.
      #
      # `-am` pulls the shared modules these depend on into the reactor, keeping each command
      # runnable on its own — copy any line and it works locally.
      - name: Verify shared modules
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl common-kafka,common-outbox --no-transfer-progress

      - name: Verify api-gateway
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl api-gateway -DexcludedGroups= --no-transfer-progress

      - name: Verify auth-service (integration)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl auth-service -DexcludedGroups= --no-transfer-progress

      - name: Verify catalog-service (integration)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl catalog-service -DexcludedGroups= --no-transfer-progress

      - name: Verify order-service (integration)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl order-service -am -DexcludedGroups= --no-transfer-progress

      - name: Verify payment-service (integration + Pact provider)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl payment-service -am -DexcludedGroups= --no-transfer-progress

      - name: Verify notification-service
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl notification-service -am -DexcludedGroups= --no-transfer-progress

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'

      # Surefire's reports say which assertion failed; the container logs say why. Without
      # these, a Testcontainers failure is only reproducible by pushing again.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  # ────────────────────────────────────────────────────────────────────────────
  # 2) SECURITY SCAN
  #    Scans the repository (dependencies + IaC) for vulnerabilities. CRITICAL findings
  #    block the build; HIGH findings are reported but non-blocking (a HIGH-severity CVE
  #    in a transitive dependency without a fix yet shouldn't halt every PR — it's
  #    triaged instead). Tighten severity/exit-code here once the backlog is clean.
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy resolves the Maven poms to walk transitive dependencies. Without a local
      # cache it hammers Maven Central and gets rate-limited (429), killing the scan.
      # Restoring the same cache the test job populated keeps the scan offline.
      - name: Set up JDK 21 (restore Maven cache)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Populate the local Maven repository
        run: mvn -B -q dependency:go-offline --no-transfer-progress

      # Gate: CRITICAL vulnerabilities fail the build outright.
      - name: Run Trivy filesystem scan (CRITICAL — build-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # Informational: HIGH vulnerabilities are surfaced in the logs for triage but never
      # fail the job. Runs even if the step above already reported CRITICAL findings, so a
      # single job run always shows the full picture.
      - name: Run Trivy filesystem scan (HIGH — informational only)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH'

  # ────────────────────────────────────────────────────────────────────────────
  # 3) HELM LINT
  #    Static validation of the Helm chart used for k8s deploys. No dependency on the
  #    Maven build, so it runs in parallel with `test` instead of behind it.
  # ────────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Template
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships Helm 3.x pre-installed (see actions/runner-images); this step
      # just fails fast and loud if that ever stops being true, instead of failing on an
      # obscure "helm: command not found" three steps later.
      - name: Helm version
        run: helm version

      # global.jwtSecret and (possibly) postgres.password are declared `required` with no
      # default in values.yaml, so a real deploy fails closed if it forgets them. Lint and
      # template only need syntactically valid placeholders, never a real secret — these
      # values never leave this job and are not the values used for any real deployment.
      - name: Helm lint
        run: |
          helm lint helm/orderhub \
            --set global.jwtSecret=ci-lint-dummy \
            --set postgres.password=ci-lint-dummy

      - name: Helm template
        run: |
          helm template helm/orderhub \
            --set global.jwtSecret=ci-lint-dummy \
            --set postgres.password=ci-lint-dummy \
            > /tmp/orderhub-rendered.yaml

      # kubeconform has no first-party GitHub Action; installing the pinned release
      # binary directly is simpler than trusting a third-party Action wrapper for it.
      - name: Install kubeconform (v0.8.0)
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # -summary keeps output short; -ignore-missing-schemas tolerates any resource kind
      # kubeconform's schema set doesn't recognize (none expected today — this chart only
      # renders core/v1 and apps/v1 kinds — but keeps this step from breaking on a future
      # CRD-backed resource instead of blocking the whole job on it).
      - name: Validate rendered manifests (kubeconform)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas /tmp/orderhub-rendered.yaml

  # ────────────────────────────────────────────────────────────────────────────
  # 4) BUILD & PUSH IMAGES  ("subir")
  #    On main only: builds each service image from its Dockerfile and pushes it to
  #    GitHub Container Registry, tagged with both `latest` and the commit SHA.
  #    These are the images the Helm chart / k8s deploys reference.
  # ────────────────────────────────────────────────────────────────────────────
  publish-images:
    name: Build & Push Images (GHCR)
    needs: [ test, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
