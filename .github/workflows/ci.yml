name: CI/CD

# Runs on every branch push (tests) and on PRs to main. Images are published to GHCR
# only when main advances (see the publish-images job).
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/orderhub

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) BUILD & TEST
  #    Compiles the whole reactor and runs unit + integration tests. Integration
  #    tests are @Tag("integration") and spin up real PostgreSQL/Kafka/Redis via
  #    Testcontainers — enabled by overriding the default `-DexcludedGroups=integration`
  #    with an empty value. Docker is available on GitHub-hosted runners.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Fast fail on any compilation error before spending time on containers.
      #
      # `install`, not `package`: the services depend on the common-kafka and common-outbox
      # modules built here. A `package` leaves them in target/ only, so the later per-module
      # commands would look for com.orderhub:common-outbox on Maven Central and fail.
      - name: Build and install all modules
        run: mvn -B clean install -DskipTests --no-transfer-progress

      # Pact is consumer-driven: order-service writes the contract, payment-service verifies
      # it. The provider's test is an ordinary unit test, so it runs in the reactor-wide step
      # below — which means the contract has to exist before that step, not after it.
      #
      # No -am: the shared modules were installed above, and -Dtest= would fail on a module
      # that has no matching test.
      - name: Generate the Pact contract (consumer)
        run: mvn -B test -pl order-service -Dtest=PaymentServiceContractTest --no-transfer-progress

      - name: Publish the Pact contract to the provider
        run: |
          mkdir -p payment-service/target/pacts
          cp order-service/target/pacts/*.json payment-service/target/pacts/

      # Everything except the Docker-backed tests, across the whole reactor. A logic error
      # fails here in about a minute instead of after waiting for containers to start.
      - name: Unit, slice, architecture and contract tests
        run: mvn -B test --no-transfer-progress

      # From here each module is verified on its own, with the @Tag("integration")
      # Testcontainers tests enabled and the JaCoCo gate applied.
      #
      # One step per module so a red build names the service straight away, and
      # `!cancelled()` so they all run: an unrelated failure in order-service should not hide
      # the state of payment-service. A failed step still fails the job.
      #
      # `-am` pulls the shared modules these depend on into the reactor, keeping each command
      # runnable on its own — copy any line and it works locally.
      - name: Verify shared modules
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl common-kafka,common-outbox --no-transfer-progress

      - name: Verify api-gateway
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl api-gateway -DexcludedGroups= --no-transfer-progress

      - name: Verify auth-service (integration)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl auth-service -DexcludedGroups= --no-transfer-progress

      - name: Verify catalog-service (integration)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl catalog-service -DexcludedGroups= --no-transfer-progress

      - name: Verify order-service (integration)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl order-service -am -DexcludedGroups= --no-transfer-progress

      - name: Verify payment-service (integration + Pact provider)
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl payment-service -am -DexcludedGroups= --no-transfer-progress

      - name: Verify notification-service
        if: ${{ !cancelled() }}
        run: mvn -B verify -pl notification-service -am -DexcludedGroups= --no-transfer-progress

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'

      # Surefire's reports say which assertion failed; the container logs say why. Without
      # these, a Testcontainers failure is only reproducible by pushing again.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  # ────────────────────────────────────────────────────────────────────────────
  # 2) SECURITY SCAN
  #    Scans the repository (dependencies + IaC) for CRITICAL/HIGH vulnerabilities.
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trivy resolves the Maven poms to walk transitive dependencies. Without a local
      # cache it hammers Maven Central and gets rate-limited (429), killing the scan.
      # Restoring the same cache the test job populated keeps the scan offline.
      - name: Set up JDK 21 (restore Maven cache)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Populate the local Maven repository
        run: mvn -B -q dependency:go-offline --no-transfer-progress

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'          # report only; do not fail the build (tighten to '1' later)
          severity: 'CRITICAL,HIGH'

  # ────────────────────────────────────────────────────────────────────────────
  # 3) BUILD & PUSH IMAGES  ("subir")
  #    On main only: builds each service image from its Dockerfile and pushes it to
  #    GitHub Container Registry, tagged with both `latest` and the commit SHA.
  #    These are the images the Helm chart / k8s deploys reference.
  # ────────────────────────────────────────────────────────────────────────────
  publish-images:
    name: Build & Push Images (GHCR)
    needs: [ test, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
