name: E2E Smoke

# Full-stack smoke test: brings up the entire docker-compose stack (Kafka, Postgres x4,
# Redis, Mailhog, all five services) and drives it through api-gateway with
# scripts/e2e/smoke.sh to prove the choreographed saga works end to end — register/login
# -> admin creates a product -> user places an order -> outbox -> Kafka -> payment-service
# -> order CONFIRMED -> stock decremented -> notification-service email in Mailhog -> the
# gateway's rate limiter kicks in under burst load.
#
# Deliberately a separate workflow from ci.yml: this is slow (full image builds + a real
# Kafka broker) and only worth running on branches that are actually about to land on main,
# plus on demand. ci.yml's own Testcontainers-based integration tests already cover each
# service in isolation; this suite is the one that proves the wiring between them.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/e2e/**'
      - '.github/workflows/e2e.yml'
      - 'docker-compose.yml'
      - 'pom.xml'
      - '**/Dockerfile'
      - '**/pom.xml'
      - '**/src/main/**'
      - '**/src/main/resources/db/migration/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Fail fast on a compile error before spending time on image builds and a real
      # Kafka/Postgres stack. `install`, not `package`: nothing downstream depends on the
      # shared modules being on the Maven repo here (each service's Dockerfile compiles its
      # own reactor slice from the copied source), but this mirrors ci.yml's own build step
      # and gives the same fast, clear failure if the reactor doesn't compile.
      - name: Build and install all modules
        run: mvn -B clean install -DskipTests --no-transfer-progress

      # docker-compose.yml requires JWT_SECRET (api-gateway and auth-service both fail fast
      # at startup without it) and reads it from a .env file in the repo root — see
      # .env.example. Never a real secret: this is a throwaway value for a stack that is
      # torn down at the end of the job.
      - name: Create .env with a generated JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" > .env

      # Every app service's Dockerfile builds from the repo-root context (`context: .`) and
      # compiles its own module with `mvn -pl <service> -am package` inside the image, so
      # there are no pre-built jars/images to publish first — `docker compose up --build` is
      # the whole build. `--wait` blocks until every service with a healthcheck reports
      # healthy (all four Postgres instances, Redis, Kafka, and all five app services
      # declare one in docker-compose.yml); services without a healthcheck (mailhog,
      # prometheus, grafana, loki, promtail, jaeger) just need to be running, which --wait
      # also covers. A generous timeout: six services each doing a from-scratch Maven build
      # inside their own image, on a cold cache, easily takes several minutes.
      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Run the smoke suite
        run: bash scripts/e2e/smoke.sh

      # Only on failure — a green run doesn't need the noise. One block per app service so
      # a failure log is easy to scan without piecing together interleaved output; `ps`
      # afterwards shows which containers (if any) never became healthy at all.
      - name: Dump service logs (on failure)
        if: failure()
        run: |
          for svc in api-gateway auth-service catalog-service order-service payment-service notification-service; do
            echo "::group::docker compose logs --tail 200 ${svc}"
            docker compose logs --tail 200 "${svc}" || true
            echo "::endgroup::"
          done

      - name: Dump infra logs (on failure)
        if: failure()
        run: |
          for svc in postgres-auth postgres-catalog postgres-order postgres-payment redis kafka mailhog; do
            echo "::group::docker compose logs --tail 200 ${svc}"
            docker compose logs --tail 200 "${svc}" || true
            echo "::endgroup::"
          done

      - name: Container status (on failure)
        if: failure()
        run: docker compose ps -a

      # Always tear down, pass or fail, so a failed run doesn't leave containers/volumes on
      # the runner (irrelevant for ephemeral GitHub-hosted runners, but keeps the job's own
      # logs clean and is the right habit if this ever runs self-hosted).
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
