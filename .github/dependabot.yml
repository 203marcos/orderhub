version: 2
updates:
  # Root reactor pom — Dependabot walks its <modules> to find every service's own pom.xml
  # and proposes version bumps across the multi-module build.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keeps the pinned SHAs in .github/workflows/*.yml current. Dependabot bumps the SHA and
  # rewrites the trailing `# vX.Y.Z` comment for us when a referenced action releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
