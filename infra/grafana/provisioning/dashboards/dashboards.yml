apiVersion: 1

providers:
  - name: OrderHub
    orgId: 1
    folder: OrderHub
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # NOTE: this path is where the dashboard JSONs would be mounted *inside* the
      # Grafana container. docker-compose.yml currently only mounts
      # ./infra/grafana/provisioning -> /etc/grafana/provisioning, so for these
      # dashboards to actually load, add a second volume to the grafana service:
      #   - ./infra/grafana/dashboards:/etc/grafana/dashboards
      # (the dashboard JSONs live in infra/grafana/dashboards/, a sibling of
      # provisioning/, per the layout this repo already uses for datasources).
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
