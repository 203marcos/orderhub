server:
  port: 8084
  # Finish in-flight requests before the JVM exits on SIGTERM instead of dropping them mid-response.
  shutdown: graceful

spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/payment_db}
    username: ${DB_USER:orderhub}
    password: ${DB_PASS:orderhub123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Payloads are serialized when the outbox row is written, so they travel as strings.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
  batch-size: ${OUTBOX_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # readiness gates traffic (needs the DB). Kafka is deliberately excluded: events go through
      # the transactional outbox, so a broker blip doesn't stop this instance serving HTTP — and
      # liveness stays limited to "is the process alive" so no dependency blip restarts the pod.
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
