apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orderhub
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/marcosdias/orderhub/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8082
            - name: ORDER_SERVICE_URL
              value: http://order-service:8083
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8084
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: value
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
