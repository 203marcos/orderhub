apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: orderhub
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/marcosdias/orderhub/notification-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: KAFKA_SERVERS
              value: kafka:9092
            - name: MAIL_HOST
              value: mailhog
            - name: MAIL_PORT
              value: "1025"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
