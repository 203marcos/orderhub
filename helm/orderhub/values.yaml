global:
  imageRegistry: ghcr.io/marcosdias/orderhub
  imageTag: latest
  jwtSecret: "dGVzdFNlY3JldEtleUZvckp3dFRlc3RpbmdPcmRlckh1YlByb2plY3QyMDI2IQ=="

postgres:
  password: orderhub123
  username: orderhub

apiGateway:
  enabled: true
  replicas: 1
  image: api-gateway
  port: 8080
  service:
    type: LoadBalancer

authService:
  enabled: true
  replicas: 1
  image: auth-service
  port: 8081
  db:
    name: auth_db

catalogService:
  enabled: true
  replicas: 1
  image: catalog-service
  port: 8082
  db:
    name: catalog_db

orderService:
  enabled: true
  replicas: 1
  image: order-service
  port: 8083
  db:
    name: order_db

paymentService:
  enabled: true
  replicas: 1
  image: payment-service
  port: 8084
  db:
    name: payment_db

notificationService:
  enabled: true
  replicas: 1
  image: notification-service
  port: 8085

# Infrastructure (PostgreSQL per service, Kafka, Redis, Jaeger, Mailhog) is expected to
# already exist in the cluster — provision it with managed services or the official
# Bitnami charts, using the service names the apps reference (postgres-<svc>, kafka,
# redis, jaeger, mailhog). For a batteries-included LOCAL environment use docker-compose,
# which bundles everything. See the chart NOTES and README for details.

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
