{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace | default "orderhub" }}
  labels:
    app: api-gateway
    {{- include "orderhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.global.imageRegistry }}/{{ .Values.apiGateway.image }}:{{ .Values.global.imageTag }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:{{ .Values.authService.port }}
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:{{ .Values.catalogService.port }}
            - name: ORDER_SERVICE_URL
              value: http://order-service:{{ .Values.orderService.port }}
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:{{ .Values.paymentService.port }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace | default "orderhub" }}
spec:
  type: {{ .Values.apiGateway.service.type | default "ClusterIP" }}
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
{{- end }}