apiVersion: v1
kind: Secret
metadata:
  name: orderhub-secrets
  namespace: {{ .Release.Namespace | default "orderhub" }}
type: Opaque
stringData:
  db-username: {{ .Values.postgres.username }}
  db-password: {{ required "postgres.password must be provided (--set postgres.password=...)" .Values.postgres.password }}
  jwt-secret: {{ required "global.jwtSecret must be provided (--set global.jwtSecret=...)" .Values.global.jwtSecret }}
