{{- if .Values.paymentService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace | default "orderhub" }}
  labels:
    app: payment-service
    {{- include "orderhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.paymentService.replicas }}
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.paymentService.image }}:{{ .Values.global.imageTag }}
          ports:
            - containerPort: {{ .Values.paymentService.port }}
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-payment:5432/{{ .Values.paymentService.db.name }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: db-username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: db-password
            - name: KAFKA_SERVERS
              value: kafka:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4317
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.paymentService.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.paymentService.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: {{ .Release.Namespace | default "orderhub" }}
spec:
  selector:
    app: payment-service
  ports:
    - port: {{ .Values.paymentService.port }}
      targetPort: {{ .Values.paymentService.port }}
{{- end }}
