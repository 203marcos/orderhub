{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace | default "orderhub" }}
  labels:
    app: auth-service
    {{- include "orderhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authService.replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.authService.image }}:{{ .Values.global.imageTag }}
          ports:
            - containerPort: {{ .Values.authService.port }}
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-auth:5432/{{ .Values.authService.db.name }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: db-username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace | default "orderhub" }}
spec:
  selector:
    app: auth-service
  ports:
    - port: {{ .Values.authService.port }}
      targetPort: {{ .Values.authService.port }}
{{- end }}
