{{- if .Values.orderService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Release.Namespace | default "orderhub" }}
  labels:
    app: order-service
    {{- include "orderhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orderService.replicas }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.orderService.image }}:{{ .Values.global.imageTag }}
          ports:
            - containerPort: {{ .Values.orderService.port }}
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-order:5432/{{ .Values.orderService.db.name }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: db-username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: orderhub-secrets
                  key: db-password
            - name: KAFKA_SERVERS
              value: kafka:9092
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:{{ .Values.catalogService.port }}
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:{{ .Values.paymentService.port }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4317
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.orderService.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.orderService.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Release.Namespace | default "orderhub" }}
spec:
  selector:
    app: order-service
  ports:
    - port: {{ .Values.orderService.port }}
      targetPort: {{ .Values.orderService.port }}
{{- end }}
