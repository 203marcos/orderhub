server:
  port: 8083
  # Finish in-flight requests before the JVM exits on SIGTERM instead of dropping them mid-response.
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_db}
    username: ${DB_USER:orderhub}
    password: ${DB_PASS:orderhub123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Payloads are serialized when the outbox row is written, so they travel as strings.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
  batch-size: ${OUTBOX_BATCH_SIZE:100}

orderhub:
  order:
    # How long an order may stay PENDING before OrderTimeoutWatchdog cancels it — the answer to
    # "what if payment-service is down for hours?"
    pending-timeout: ${ORDER_PENDING_TIMEOUT:30m}
    watchdog:
      fixed-delay-ms: ${ORDER_WATCHDOG_FIXED_DELAY_MS:60000}
      batch-size: ${ORDER_WATCHDOG_BATCH_SIZE:100}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # A 404 is a valid business answer, not an outage — don't let it open the breaker.
        ignore-exceptions:
          - feign.FeignException$NotFound

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # readiness gates traffic (needs the DB). Kafka is deliberately excluded: events go through
      # the transactional outbox, so a broker blip doesn't stop this instance serving HTTP — and
      # liveness stays limited to "is the process alive" so no dependency blip restarts the pod.
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
